<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haliç Antik Mezat - Ürün Vitrini</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #141b24;
            --card-border: #222d3d;
            --accent-gold: #d4af37;
            --accent-gold-dark: #aa8622;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --btn-green: #059669;
            --btn-red: #881337;
            --btn-red-bright: #e11d48;
            --btn-cart: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-light); padding: 15px; }
        
        .vitrin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-gold); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .vitrin-header h2 { color: var(--accent-gold); font-size: 18px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-live { background: var(--btn-green); color: #fff; padding: 7px 14px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px; }
        .btn-sepet-goruntule { background: #2563eb; color: #fff; padding: 7px 14px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px; border: none; cursor: pointer; }
        .btn-sepet-goruntule:hover { background: #1d4ed8; }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-row input, .filter-row select { background: #080c13; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        .filter-row input { flex: 1; min-width: 220px; }
        .filter-row select { min-width: 180px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s; }
        .item-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .item-img-box { width: 100%; height: 170px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .item-content { padding: 10px; display: flex; flex-direction: column; flex: 1; gap: 4px; }
        .item-lot { font-size: 11px; color: var(--accent-gold); font-weight: bold; }
        .item-title { font-size: 12px; font-weight: bold; color: #fff; line-height: 1.3; height: 32px; overflow: hidden; }
        
        .price-badge-row { display: flex; justify-content: space-between; align-items: center; background: #080c13; padding: 5px 8px; border-radius: 4px; margin: 4px 0; }
        .item-price { font-size: 13px; font-weight: 800; color: #34d399; }
        .item-buy-now { font-size: 11px; font-weight: bold; color: #f87171; }
        
        .btn-group { display: flex; gap: 4px; margin-top: auto; }
        .btn-on-teklif { flex: 1; background: var(--accent-gold); color: #111; border: none; padding: 7px 4px; border-radius: 4px; font-weight: 800; font-size: 11px; cursor: pointer; text-align: center; }
        .btn-hemen-al { flex: 1; background: var(--btn-red-bright); color: #fff; border: 1px solid #be123c; padding: 7px 4px; border-radius: 4px; font-weight: 800; font-size: 11px; cursor: pointer; text-align: center; }
        .btn-hemen-al:hover { background: #be123c; }
        
        .btn-direkt-sepet { width: 100%; background: var(--btn-cart); color: #fff; border: none; padding: 8px 4px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; text-align: center; margin-top: 5px; transition: 0.2s; }
        .btn-direkt-sepet:hover { background: #059669; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--card-bg); padding: 16px; border-radius: 8px; width: 90%; max-width: 380px; text-align: left; border: 1.5px solid var(--accent-gold); }
        .modal-content input { width: 100%; padding: 8px; margin: 6px 0; background: #080c13; border: 1px solid var(--card-border); color: #fff; border-radius: 4px; font-size: 13px; }
        .modal-content button { width: 100%; padding: 8px; margin-top: 6px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .btn-sepet-sil { background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .btn-sepet-sil:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="vitrin-header">
    <h2>🏛️ HALİÇ ANTİK MEZAT - KATALOG & VİTRİN</h2>
    <div class="header-actions">
        <button onclick="sepetModalGoster()" class="btn-sepet-goruntule" id="vitrinSepetSayac">🛒 Sepetim</button>
        <a href="/" class="btn-live">🔴 Canlı Mezata Git</a>
    </div>
</div>

<div class="filter-row">
    <input type="text" id="vitrinArama" placeholder="🔍 Lot No veya Ürün Adı Yazın..." oninput="vitrinYukle()">
    <select id="vitrinKategori" onchange="vitrinYukle()">
        <option value="">Tüm Kategoriler</option>
    </select>
</div>

<div id="vitrinGrid" class="grid-container">
    <div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted);">Ürünler yükleniyor...</div>
</div>

<!-- Teklif / Profil Modalı -->
<div id="vitrinOnTeklifModal" class="modal">
    <div class="modal-content">
        <h3 id="modalUrunBaslik" style="color:var(--accent-gold); font-size:13px; font-weight:800; margin-bottom:6px;">Ön Teklif Ver</h3>
        <p style="font-size:11px; color:#94a3b8; margin-bottom:8px;">Açılış Fiyatı: <b id="modalAcilisFiyat" style="color:#34d399;">0 TL</b></p>
        
        <label style="font-size:10px; font-weight:bold;">Adınız Soyadınız:</label>
        <input type="text" id="vitrinAd" placeholder="Adınız Soyadınız">
        
        <label style="font-size:10px; font-weight:bold;">Telefon Numaranız:</label>
        <input type="text" id="vitrinTel" placeholder="05XX XXX XX XX">
        
        <div id="tutarAlaniKutusu">
            <label style="font-size:10px; font-weight:bold;">Teklif Ettiğiniz Tutar (TL):</label>
            <input type="number" id="vitrinTutar" placeholder="Örn: 500">
        </div>
        
        <button id="modalOnayBtn" style="background:var(--accent-gold); color:#111;" onclick="onTeklifGonderVitrin()">🚀 Teklifi Kaydet</button>
        <button style="background:#475569; color:#fff;" onclick="modalKapat()">Vazgeç</button>
    </div>
</div>

<!-- Sepet İnceleme Modalı -->
<div id="vitrinSepetModal" class="modal">
    <div class="modal-content" style="max-width: 490px;">
        <h3 style="color:var(--accent-gold); font-size:15px; font-weight:bold; margin-bottom:10px;">🛒 Alışveriş Sepetiniz</h3>
        <div id="vitrinSepetIcerik" style="max-height: 260px; overflow-y: auto; margin-bottom: 12px; font-size: 13px;">
            Yükleniyor...
        </div>
        <div id="vitrinSepetOzet" style="border-top: 1px solid var(--card-border); padding-top: 8px; font-size: 12px;"></div>
        <button style="background:#475569; color:#fff; margin-top:10px;" onclick="document.getElementById('vitrinSepetModal').style.display='none'">Kapat</button>
    </div>
</div>

<script>
    let seciliModalUrunId = null;
    let seciliModalMinFiyat = 0;
    let modalModu = 'on_teklif';
    let seciliHemenAlFiyati = 0;

    function temizKategoriAdi(kat) {
        if (!kat) return 'Genel';
        return kat.replace(/^kategorilerimiz\s*[»>]\s*/i, '')
                  .replace(/^kategoriler\s*[»>]\s*/i, '')
                  .trim();
    }

    function kategorileriYukle() {
        fetch('/kategoriler-listesi')
            .then(r => r.json())
            .then(list => {
                const sel = document.getElementById('vitrinKategori');
                sel.innerHTML = '<option value="">Tüm Kategoriler</option>';
                if (Array.isArray(list)) {
                    list.forEach(k => {
                        if (k && k.trim()) {
                            let opt = document.createElement('option');
                            opt.value = k;
                            opt.innerText = temizKategoriAdi(k);
                            sel.appendChild(opt);
                        }
                    });
                }
            })
            .catch(e => {});
    }

    function vitrinYukle() {
        const arama = document.getElementById('vitrinArama').value.trim();
        const kat = document.getElementById('vitrinKategori').value;
        const grid = document.getElementById('vitrinGrid');

        fetch(`/vitrin-urunler?arama=${encodeURIComponent(arama)}&kategori=${encodeURIComponent(kat)}&limit=150`)
            .then(r => r.json())
            .then(data => {
                if (!data.urunler || data.urunler.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted);">Aramanıza uygun ürün bulunamadı.</div>';
                    return;
                }

                grid.innerHTML = data.urunler.map(u => {
                    let gorsel = (u.fotograflar && u.fotograflar.length > 0) ? u.fotograflar[0] : '';
                    let hemenAl = u.hemen_al_fiyati || u.hemen_al_fiyat || 0;
                    let acilisFiyat = Number(u.fiyat || 0);
                    let sadeKategori = temizKategoriAdi(u.kategori);

                    return `
                        <div class="item-card">
                            <div class="item-img-box">
                                ${gorsel ? `<img src="${gorsel}" alt="${u.ad}">` : `<span style="color:#666; font-size:11px;">Görsel Yok</span>`}
                            </div>
                            <div class="item-content">
                                <span class="item-lot">LOT #${u.lot} • ${sadeKategori}</span>
                                <div class="item-title" title="${u.ad}">${u.ad}</div>
                                
                                <div class="price-badge-row">
                                    <div>
                                        <div style="font-size:9px; color:#94a3b8;">AÇILIŞ</div>
                                        <div class="item-price">${acilisFiyat.toLocaleString('tr-TR')} TL</div>
                                    </div>
                                    ${hemenAl > 0 ? `
                                    <div style="text-align:right;">
                                        <div style="font-size:9px; color:#94a3b8;">HEMEN AL</div>
                                        <div class="item-buy-now">${Number(hemenAl).toLocaleString('tr-TR')} TL</div>
                                    </div>` : ''}
                                </div>
                                
                                <div class="btn-group">
                                    <button class="btn-on-teklif" onclick="modalAc(${u.id}, '${u.lot}', '${escape(u.ad)}', ${acilisFiyat})">📝 Ön Teklif</button>
                                    <button class="btn-hemen-al" onclick="vitrindenHemenAl(${u.id}, '${u.lot}', '${escape(u.ad)}', ${hemenAl > 0 ? hemenAl : acilisFiyat})">⚡ Hemen Al</button>
                                </div>
                                <button class="btn-direkt-sepet" onclick="vitrindenSepeteEkle(${u.id}, '${escape(u.ad)}')">🛒 Sepete Ekle</button>
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(e => {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#f87171;">Veriler alınamadı.</div>';
            });
    }

    // --- DOĞRUDAN SEPETE EKLEME FONKSİYONU ---
    async function vitrindenSepeteEkle(urunId, urunAdi) {
        let kayitliId = localStorage.getItem('halic_antik_id');
        let kayitliAd = (localStorage.getItem('halic_antik_ad') || '').trim();
        let kayitliTel = localStorage.getItem('halic_antik_tel') || '';

        if (!kayitliId || !kayitliAd) {
            const ad = prompt("Sepete ürün eklemek için lütfen Adınızı ve Soyadınızı giriniz:");
            if (!ad || !ad.trim()) return;
            const tel = prompt("Lütfen Telefon Numaranızı giriniz:") || "05550000000";

            try {
                const kRes = await fetch('/kayit-ol', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ad: ad.trim(), tel: tel.trim(), sozlesme: true })
                });
                const kData = await kRes.json();
                if (kData.success && kData.musteri_id) {
                    kayitliId = kData.musteri_id;
                    kayitliAd = ad.trim();
                    kayitliTel = tel.trim();
                    localStorage.setItem('halic_antik_id', kayitliId);
                    localStorage.setItem('halic_antik_ad', kayitliAd);
                    localStorage.setItem('halic_antik_tel', kayitliTel);
                } else {
                    alert("Kayıt oluşturulamadı.");
                    return;
                }
            } catch (e) {
                alert("Bağlantı hatası.");
                return;
            }
        }

        try {
            const res = await fetch('/sepete-ekle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    musteri_id: parseInt(kayitliId),
                    urun_id: parseInt(urunId)
                })
            });
            const data = await res.json();
            if (data.success) {
                alert(`✅ "${unescape(urunAdi)}" başarıyla sepetinize eklendi!`);
            } else {
                alert("⚠️ " + data.mesaj);
            }
        } catch (err) {
            alert("Ürün sepete eklenirken hata oluştu.");
        }
    }

    // --- SEPET İÇERİĞİNİ GÖRÜNTÜLEME MODALI ---
    function sepetModalGoster() {
        const musteriId = localStorage.getItem('halic_antik_id');
        const musteriAd = localStorage.getItem('halic_antik_ad');
        const modal = document.getElementById('vitrinSepetModal');
        const icerik = document.getElementById('vitrinSepetIcerik');
        const ozet = document.getElementById('vitrinSepetOzet');

        if (!musteriId && !musteriAd) {
            alert("Sepetinizi görüntülemek için önce sepete bir ürün eklemelisiniz.");
            return;
        }

        icerik.innerHTML = "Sepet yükleniyor...";
        ozet.innerHTML = "";
        modal.style.display = 'flex';

        const istekUrl = musteriId ? `/sepet-getir/${musteriId}` : `/sepet-getir/0?ad=${encodeURIComponent(musteriAd)}`;

        fetch(istekUrl)
            .then(r => r.json())
            .then(res => {
                if (!res.urunler || res.urunler.length === 0) {
                    icerik.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Sepetinizde ürün bulunmamaktadır.</p>";
                    return;
                }

                icerik.innerHTML = res.urunler.map(it => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid #1e293b;">
                        <div style="flex:1; padding-right:10px;">
                            <span><b>Lot #${it.lot}</b> - ${it.ad}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="color:#34d399; font-weight:bold;">${Number(it.fiyat).toLocaleString('tr-TR')} TL</span>
                            <button onclick="sepettenUrunCikar(${it.urun_id}, ${it.sepet_id})" class="btn-sepet-sil" title="Sepetten Çıkar">❌ Çıkar</button>
                        </div>
                    </div>
                `).join('');

                ozet.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Ara Toplam:</span> <b>${res.ara_toplam.toLocaleString('tr-TR')} TL</b></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>KDV (%20):</span> <b>${res.kdv_tutari.toLocaleString('tr-TR')} TL</b></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Kargo:</span> <b>${res.kargo_ucreti.toLocaleString('tr-TR')} TL</b></div>
                    <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:14px; color:var(--accent-gold); font-weight:bold;"><span>GENEL TOPLAM:</span> <span>${res.genel_toplam.toLocaleString('tr-TR')} TL</span></div>
                `;
            })
            .catch(() => {
                icerik.innerHTML = "Sepet bilgisi alınamadı.";
            });
    }

    // --- SEPETTEN ÇIKARMA FONKSİYONU ---
    async function sepettenUrunCikar(urunId, sepetId) {
        const musteriId = localStorage.getItem('halic_antik_id');
        if (!confirm("Bu ürünü sepetinizden çıkarmak istediğinize emin misiniz?")) return;

        try {
            const res = await fetch('/sepetten-cikar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    musteri_id: musteriId ? parseInt(musteriId) : null,
                    urun_id: parseInt(urunId),
                    sepet_id: sepetId || 0
                })
            });
            const data = await res.json();
            if (data.success) {
                sepetModalGoster();
            } else {
                alert("⚠️ " + (data.mesaj || "Ürün sepetten çıkarılamadı."));
            }
        } catch (e) {
            alert("İşlem sırasında hata oluştu.");
        }
    }

    function vitrindenHemenAl(id, lot, ad, hemenAlBedeli) {
        let kayitliAd = (localStorage.getItem('halic_antik_ad') || '').replace(/^\[.*?\]\s*/, '').trim();
        let kayitliTel = localStorage.getItem('halic_antik_tel') || '';
        let kayitliId = localStorage.getItem('halic_antik_id');

        if (!kayitliAd || !kayitliTel) {
            modalModu = 'hemen_al';
            seciliModalUrunId = id;
            seciliHemenAlFiyati = hemenAlBedeli;
            document.getElementById('modalUrunBaslik').innerText = `⚡ HEMEN AL: LOT #${lot} - ${unescape(ad)}`;
            document.getElementById('modalAcilisFiyat').innerText = `${hemenAlBedeli.toLocaleString('tr-TR')} TL`;
            document.getElementById('tutarAlaniKutusu').style.display = 'none';
            document.getElementById('modalOnayBtn').innerText = "💳 Hemen Satın Al";
            document.getElementById('modalOnayBtn').style.background = "#e11d48";
            document.getElementById('modalOnayBtn').style.color = "#fff";
            document.getElementById('vitrinAd').value = '';
            document.getElementById('vitrinTel').value = '';
            document.getElementById('vitrinOnTeklifModal').style.display = 'flex';
            return;
        }

        if (!confirm(`LOT #${lot} - ${unescape(ad)} ürününü ${hemenAlBedeli.toLocaleString('tr-TR')} TL bedelle hemen satın alıp sepetinize eklemek istiyor musunuz?`)) {
            return;
        }

        fetch('/pey-ver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                urun_id: id,
                musteri_id: kayitliId ? parseInt(kayitliId) : null,
                musteri_adi: kayitliAd,
                telefon: kayitliTel,
                islem: 'hemen_al'
            })
        }).then(r => r.json()).then(res => {
            if (res.success) {
                alert(`🎉 Tebrikler! Ürün ${hemenAlBedeli} TL bedelle sepetinize eklendi.`);
                vitrinYukle();
            } else {
                alert(res.mesaj || "Satın alma işlemi gerçekleştirilemedi.");
            }
        });
    }

    function modalAc(id, lot, ad, acilis) {
        modalModu = 'on_teklif';
        seciliModalUrunId = id;
        seciliModalMinFiyat = acilis;
        document.getElementById('modalUrunBaslik').innerText = `LOT #${lot} - ${unescape(ad)}`;
        document.getElementById('modalAcilisFiyat').innerText = `${acilis.toLocaleString('tr-TR')} TL`;
        document.getElementById('tutarAlaniKutusu').style.display = 'block';
        document.getElementById('modalOnayBtn').innerText = "🚀 Teklifi Kaydet";
        document.getElementById('modalOnayBtn').style.background = "var(--accent-gold)";
        document.getElementById('modalOnayBtn').style.color = "#111";
        
        let kayitliAd = (localStorage.getItem('halic_antik_ad') || '').replace(/^\[.*?\]\s*/, '').trim();
        let kayitliTel = localStorage.getItem('halic_antik_tel') || '';
        document.getElementById('vitrinAd').value = kayitliAd;
        document.getElementById('vitrinTel').value = kayitliTel;
        document.getElementById('vitrinTutar').value = '';
        
        document.getElementById('vitrinOnTeklifModal').style.display = 'flex';
    }

    function modalKapat() {
        document.getElementById('vitrinOnTeklifModal').style.display = 'none';
        seciliModalUrunId = null;
    }

    function onTeklifGonderVitrin() {
        let ad = document.getElementById('vitrinAd').value.trim();
        let tel = document.getElementById('vitrinTel').value.trim();

        if (!ad || !tel) return alert("Lütfen adınızı ve telefonunuzu yazınız!");

        fetch('/kayit-ol', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ad: ad, tel: tel, sozlesme: true })
        }).then(r => r.json()).then(kayitRes => {
            localStorage.setItem('halic_antik_ad', ad);
            localStorage.setItem('halic_antik_tel', tel);
            if (kayitRes.musteri_id) localStorage.setItem('halic_antik_id', kayitRes.musteri_id);

            if (modalModu === 'hemen_al') {
                fetch('/pey-ver', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        urun_id: seciliModalUrunId,
                        musteri_id: kayitRes.musteri_id || null,
                        musteri_adi: ad,
                        telefon: tel,
                        islem: 'hemen_al'
                    })
                }).then(r2 => r2.json()).then(d => {
                    if (d.success) {
                        alert(`🎉 Tebrikler! Ürün sepetinize eklendi.`);
                        modalKapat();
                        vitrinYukle();
                    } else {
                        alert(d.mesaj || "Satın alma yapılamadı.");
                    }
                });
            } else {
                let tutar = parseFloat(document.getElementById('vitrinTutar').value);
                if (isNaN(tutar) || tutar < seciliModalMinFiyat) {
                    return alert(`Ön teklif açılış fiyatından (${seciliModalMinFiyat} TL) düşük olamaz!`);
                }

                fetch('/on-teklif-ver', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        urun_id: seciliModalUrunId,
                        musteri_id: kayitRes.musteri_id || null,
                        musteri_adi: ad,
                        teklif: tutar
                    })
                }).then(r3 => r3.json()).then(d => {
                    alert(d.mesaj || "Ön teklif başarıyla kaydedildi.");
                    modalKapat();
                    vitrinYukle();
                });
            }
        });
