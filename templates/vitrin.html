<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haliç Antik Mezat - Ürün Kataloğu & Vitrin</title>
    <style>
        :root {
            --bg-dark: #0b132b;
            --card-bg: #1c2541;
            --card-border: #334155;
            --accent-gold: #ffb703;
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
            --btn-green: #10b981;
            --btn-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-gold); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--accent-gold); font-size: 24px; }
        .btn-live { background: var(--btn-red); color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; outline: none; }
        .filter-bar input { flex: 1; min-width: 220px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .product-card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; background: #070d1e; }
        .product-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .lot-badge { font-size: 11px; background: #334155; color: var(--accent-gold); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; font-weight: bold; }
        .product-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #fff; line-height: 1.3; }
        .price-box { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .price { font-size: 16px; color: #34d399; font-weight: bold; }
        .buy-now-price { font-size: 13px; color: var(--accent-gold); font-weight: bold; }
        
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 30px; flex-wrap: wrap; }
        .page-btn { padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .page-btn.active { background: var(--accent-gold); color: #000; font-weight: bold; border-color: var(--accent-gold); }
        .page-btn:hover:not(.active) { background: #334155; }

        /* DETAY VE ÖN TEKLİF MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--card-bg); border: 1.5px solid var(--accent-gold); padding: 20px; border-radius: 8px; width: 90%; max-width: 480px; }
        .modal-img { width: 100%; height: 220px; object-fit: contain; background: #000; border-radius: 6px; margin-bottom: 10px; }
        .btn-modal { width: 100%; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-modal-green { background: var(--btn-green); color: #fff; }
        .btn-modal-gray { background: #475569; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏛️ HALİÇ ANTİK MEZAT - VİTRİN & KATALOG</h1>
        <a href="/" class="btn-live">🔴 Canlı Mezata Katıl</a>
    </div>

    <div class="filter-bar">
        <input type="text" id="arama" placeholder="Lot No veya Ürün Adı Ara..." oninput="debounceArama()">
        <select id="kategoriSec" onchange="vitrinYukle(1)">
            <option value="">Tüm Kategoriler</option>
        </select>
    </div>

    <div class="grid" id="urunGrid"></div>
    <div class="pagination" id="sayfalama"></div>
</div>

<!-- ÜRÜN DETAY VE ÖN TEKLİF PENCERESİ -->
<div id="urunDetayModal" class="modal">
    <div class="modal-content">
        <img id="modalImg" class="modal-img" src="" alt="Ürün">
        <span class="lot-badge" id="modalLot">LOT #0</span>
        <h3 id="modalAd" style="color: var(--accent-gold); margin-bottom: 6px; font-size: 16px;">-</h3>
        <p id="modalKategori" style="font-size: 12px; color: var(--accent-blue); margin-bottom: 8px;">-</p>
        <p id="modalAciklama" style="font-size: 12px; color: #cbd5e1; line-height: 1.4; max-height: 80px; overflow-y: auto; margin-bottom: 10px;">-</p>
        
        <div style="background: #070d1e; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; display: flex; justify-content: space-between;">
            <span>Açılış: <b id="modalFiyat" style="color: #34d399;">0 TL</b></span>
            <span>Hemen Al: <b id="modalHemenAl" style="color: var(--accent-gold);">0 TL</b></span>
        </div>

        <input type="number" id="modalOnTeklif" placeholder="Ön Teklif Tutarı (TL)" style="width:100%; padding:9px; background:#070d1e; border:1px solid var(--card-border); color:#fff; border-radius:5px; margin-bottom:6px; outline:none;">
        <button class="btn-modal btn-modal-green" onclick="modalOnTeklifVer()">🚀 Ön Teklif Gönder</button>
        <button class="btn-modal btn-modal-gray" onclick="modalKapat()">Kapat</button>
    </div>
</div>

<script>
    let aktifSayfa = 1;
    let seciliUrun = null;
    let aramaZamanlayici = null;
    let yuklenenUrunler = [];

    function debounceArama() {
        clearTimeout(aramaZamanlayici);
        aramaZamanlayici = setTimeout(() => {
            vitrinYukle(1);
        }, 300);
    }

    function kategorileriDoldur() {
        fetch('/kategoriler-listesi')
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById('kategoriSec');
            select.innerHTML = '<option value="">Tüm Kategoriler</option>';
            
            if (data.kategoriler && data.kategoriler.length > 0) {
                data.kategoriler.forEach(kat => {
                    let opt = document.createElement('option');
                    opt.value = kat;
                    opt.innerText = kat;
                    select.appendChild(opt);
                });
            }
        });
    }

    function vitrinYukle(sayfa = 1) {
        aktifSayfa = sayfa;
        const kat = document.getElementById('kategoriSec').value;
        const ara = document.getElementById('arama').value.trim();
        
        fetch(`/vitrin-urunler?sayfa=${sayfa}&limit=24&kategori=${encodeURIComponent(kat)}&arama=${encodeURIComponent(ara)}`)
        .then(res => res.json())
        .then(data => {
            const grid = document.getElementById('urunGrid');
            grid.innerHTML = "";
            yuklenenUrunler = data.urunler || [];
            
            if (!data.urunler || data.urunler.length === 0) {
                grid.innerHTML = "<p style='color:#94a3b8; grid-column:1/-1; text-align:center; padding: 40px;'>Bu kriterlere uygun ürün bulunamadı.</p>";
                document.getElementById('sayfalama').innerHTML = "";
                return;
            }

            data.urunler.forEach(u => {
                const img = (u.fotograflar && u.fotograflar.length > 0) ? u.fotograflar[0] : (u.video ? '/static/img/video-thumb.png' : 'https://via.placeholder.com/300x200?text=Gorsel+Yok');
                const hemenAlTxt = u.hemen_al_fiyat > 0 ? `<span class="buy-now-price">Hemen Al: ${u.hemen_al_fiyat} TL</span>` : '';
                
                grid.innerHTML += `
                    <div class="product-card" onclick="detayModalAc(${u.id})">
                        <img src="${img}" alt="${u.ad}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=Gorsel+Yuklenemedi'">
                        <div class="product-info">
                            <div>
                                <span class="lot-badge">Lot #${u.lot}</span>
                                <div class="product-title">${u.ad}</div>
                                <p style="font-size:12px; color:#94a3b8;">${u.kategori || 'Genel'}</p>
                            </div>
                            <div class="price-box">
                                <span class="price">${u.fiyat} TL</span>
                                ${hemenAlTxt}
                            </div>
                        </div>
                    </div>
                `;
            });

            // Sayfalama Motoru
            const sayfaDiv = document.getElementById('sayfalama');
            sayfaDiv.innerHTML = "";
            const toplamSayfa = data.toplam_sayfa || 1;

            if (toplamSayfa > 1) {
                if (sayfa > 1) {
                    sayfaDiv.innerHTML += `<button class="page-btn" onclick="vitrinYukle(${sayfa - 1})">« Önceki</button>`;
                }

                let baslangic = Math.max(1, sayfa - 2);
                let bitis = Math.min(toplamSayfa, sayfa + 2);

                if (baslangic > 1) {
                    sayfaDiv.innerHTML += `<button class="page-btn" onclick="vitrinYukle(1)">1</button>`;
                    if (baslangic > 2) sayfaDiv.innerHTML += `<span style="color:#94a3b8; padding:5px;">...</span>`;
                }

                for (let i = baslangic; i <= bitis; i++) {
                    sayfaDiv.innerHTML += `<button class="page-btn ${i === sayfa ? 'active' : ''}" onclick="vitrinYukle(${i})">${i}</button>`;
                }

                if (bitis < toplamSayfa) {
                    if (bitis < toplamSayfa - 1) sayfaDiv.innerHTML += `<span style="color:#94a3b8; padding:5px;">...</span>`;
                    sayfaDiv.innerHTML += `<button class="page-btn" onclick="vitrinYukle(${toplamSayfa})">${toplamSayfa}</button>`;
                }

                if (sayfa < toplamSayfa) {
                    sayfaDiv.innerHTML += `<button class="page-btn" onclick="vitrinYukle(${sayfa + 1})">Sonraki »</button>`;
                }
            }
        });
    }

    function detayModalAc(urunId) {
        seciliUrun = yuklenenUrunler.find(u => u.id === urunId);
        if (!seciliUrun) return;

        const img = (seciliUrun.fotograflar && seciliUrun.fotograflar.length > 0) ? seciliUrun.fotograflar[0] : 'https://via.placeholder.com/300x200?text=Gorsel+Yok';
        
        document.getElementById('modalImg').src = img;
        document.getElementById('modalLot').innerText = `LOT #${seciliUrun.lot}`;
        document.getElementById('modalAd').innerText = seciliUrun.ad;
        document.getElementById('modalKategori').innerText = seciliUrun.kategori || 'Genel';
        document.getElementById('modalAciklama').innerText = seciliUrun.tanitim_yazisi || 'Açıklama bulunmuyor.';
        document.getElementById('modalFiyat').innerText = `${seciliUrun.fiyat} TL`;
        document.getElementById('modalHemenAl').innerText = `${seciliUrun.hemen_al_fiyat || 0} TL`;
        document.getElementById('modalOnTeklif').value = "";

        document.getElementById('urunDetayModal').style.display = 'flex';
    }

    function modalOnTeklifVer() {
        const musteriAdi = localStorage.getItem('halic_antik_ad');
        const musteriId = localStorage.getItem('halic_antik_id');
        const musteriTel = localStorage.getItem('halic_antik_tel');
        const teklif = parseFloat(document.getElementById('modalOnTeklif').value);

        if (!musteriAdi) {
            alert("Ön teklif verebilmek için lütfen önce canlı mezat sayfasından kayıt olunuz.");
            window.location.href = '/';
            return;
        }

        if (!seciliUrun || isNaN(teklif) || teklif <= 0) {
            alert("Lütfen geçerli bir teklif tutarı giriniz!");
            return;
        }

        fetch('/on-teklif-ver', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                urun_id: seciliUrun.id,
                musteri_id: musteriId ? parseInt(musteriId) : null,
                musteri_adi: musteriAdi,
                telefon: musteriTel || '',
                teklif: teklif
            })
        })
        .then(res => res.json())
        .then(d => {
            alert(d.mesaj);
            if (d.success) {
                modalKapat();
            }
        });
    }

    function modalKapat() {
        document.getElementById('urunDetayModal').style.display = 'none';
    }

    window.onload = () => {
        kategorileriDoldur();
        vitrinYukle(1);
    };
</script>
</body>
</html>
