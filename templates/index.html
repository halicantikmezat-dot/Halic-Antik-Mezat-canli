<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haliç Antik - Canlı İzleyici</title>
    <style>
        body { background-color: #0d1b2a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: #1b263b; padding: 20px; border-radius: 8px; border: 1px solid #415a77; }
        h1 { color: #ffb703; font-size: 20px; text-align: center; margin-top: 0; }
        .box { background: #111b2b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #415a77; }
        input, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; font-size: 15px; }
        button { padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-mavi { background: #3b82f6; color: #fff; }
        .btn-yesil { background: #10b981; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ HALİÇ ANTİK - CANLI İZLEYİCİ</h1>

    <div class="box" id="girisKutusu">
        <h3 style="margin-top:0; color:#38bdf8; font-size:16px;">👤 İzleyici Girişi</h3>
        <label>Adınız Soyadınız:</label>
        <input type="text" id="kullaniciAdiInput" placeholder="Adınızı girin...">
        <button onclick="kullaniciKaydet()" class="btn-yesil" style="margin-top:10px;">Giriş Yap / Kaydol</button>
    </div>

    <div class="box" id="aktifKullaniciKutusu" style="display:none; display:flex; justify-content:space-between; align-items:center;">
        <span>👤 <b id="gorunenAd"></b> | Puan: <b id="gorunenPuan">0</b></span>
        <button onclick="kullaniciDegistir()" class="btn-mavi" style="width:auto; padding:6px 12px; font-size:13px;">Değiştir</button>
    </div>

    <div class="box" style="border: 2px solid #ffb703; text-align:center;">
        <h3 id="sahneBaslik" style="color:#ffb703; margin-top:0;">Lot # - Sahnede aktif ürün yok</h3>
        <div id="sahneMedyaAlani" style="min-height:200px; background:#0d1b2a; display:flex; align-items:center; justify-content:center; border-radius:6px; margin-bottom:10px; overflow:hidden;">
            <span style="color:#64748b;">Yöneticinin ürünü sahneye alması bekleniyor...</span>
        </div>
        <div id="sahneDetay" style="font-size:14px; text-align:left; color:#cbd5e1; margin-bottom:10px;"></div>
        
        <div id="peyAlani" style="display:none; margin-top:10px;">
            <h4 style="color:#38bdf8; margin:5px 0;" id="guncelFiyatYazi">Fiyat: 0 TL</h4>
            <div style="display:flex; gap:10px;">
                <button onclick="peyVer(100)" class="btn-yesil">+100 TL Pey Ver</button>
                <button onclick="peyVer(500)" class="btn-yesil">+500 TL Pey Ver</button>
                <button onclick="hemenAlSatinal()" class="btn-mavi" id="hemenAlBtn" style="background:#f59e0b;">Hemen Al</button>
            </div>
        </div>
    </div>

    <div class="box">
        <h3 style="margin-top:0; color:#38bdf8; font-size:16px;">🔍 10.000 Ürün Arşivi & Önden Teklif Ver</h3>
        <label>Kategori Filtrele:</label>
        <select id="kategoriSecim" onchange="kategoriFiltrele()">
            <option value="tumu">Tüm Kategoriler (10.000 Ürün)</option>
            <option value="Mobilya ve ahşap ürünler">Mobilya ve ahşap ürünler</option>
            <option value="Halı Kilim bez dan örtüler">Halı Kilim bez ve örtüler</option>
            <option value="Obje ve Aksesuarlar">Obje ve Aksesuarlar</option>
            <option value="Porselen dan Seramik">Porselen ve Seramik</option>
            <option value="Tablolar ve Resim">Tablolar ve Resim</option>
            <option value="Aydınlatma ve aksesuarları">Aydınlatma ve aksesuarları</option>
            <option value="Kitap dergi resim dan efemera">Kitap dergi resim ve efemera</option>
            <option value="Takı ve bijuteri">Takı ve bijuteri</option>
        </select>

        <label>Ürün Seç:</label>
        <select id="arsivUrunSecim">
            <option value="">Arşivden ürün seçiniz...</option>
        </select>

        <label>Ön Teklif Tutarınız (TL):</label>
        <input type="number" id="onTeklifTutar" placeholder="Örn: 1500">
        <button onclick="onTeklifGonder()" class="btn-mavi" style="margin-top:8px;">🚀 Bu Ürüne Önden Teklif Ver / Yöneticiye İlet</button>
    </div>
</div>

<script>
let aktifKullanici = localStorage.getItem('halic_kullanici') || "";

document.addEventListener("DOMContentLoaded", () => {
    if(aktifKullanici) {
        document.getElementById('girisKutusu').style.display = 'none';
        document.getElementById('aktifKullaniciKutusu').style.display = 'flex';
        document.getElementById('gorunenAd').innerText = aktifKullanici;
    }
    veriGetirIzleyici();
});

function kullaniciKaydet() {
    let ad = document.getElementById('kullaniciAdiInput').value.trim();
    if(!ad) { alert("Lütfen adınızı girin!"); return; }
    localStorage.setItem('halic_kullanici', ad);
    aktifKullanici = ad;
    document.getElementById('girisKutusu').style.display = 'none';
    document.getElementById('aktifKullaniciKutusu').style.display = 'flex';
    document.getElementById('gorunenAd').innerText = ad;
}

function kullaniciDegistir() {
    localStorage.removeItem('halic_kullanici');
    location.reload();
}

function veriGetirIzleyici() {
    fetch('/durum-getir')
    .then(res => res.json())
    .then(data => {
        // Aktif Sahne Güncelleme
        let sahneBaslik = document.getElementById('sahneBaslik');
        let sahneMedya = document.getElementById('sahneMedyaAlani');
        let sahneDetay = document.getElementById('sahneDetay');
        let peyAlani = document.getElementById('peyAlani');

        if(data.aktif_urun) {
            let u = data.aktif_urun;
            sahneBaslik.innerText = `Lot #${u.lot} - ${u.ad}`;
            
            let medyaHtml = '';
            if(u.medya) {
                if(u.medya.match(/\.(mp4|webm|ogg)$/i)) {
                    medyaHtml = `<video src="${u.medya}" controls autoplay style="max-width:100%; max-height:250px;"></video>`;
                } else {
                    medyaHtml = `<img src="${u.medya}" style="max-width:100%; max-height:250px; object-fit:contain;">`;
                }
            } else {
                medyaHtml = `<span style="color:#64748b;">Görsel bulunmuyor</span>`;
            }
            sahneMedya.innerHTML = medyaHtml;

            sahneDetay.innerHTML = `<b>Kategori:</b> ${u.kategori || '-'}<br>
                                    <b>Hikaye / Secere:</b> ${u.tanitim_yazisi || 'Belirtilmemiş'}<br>
                                    <b>Güncel Fiyat:</b> <span style="color:#38bdf8; font-size:16px;">${u.fiyat} TL</span>`;
            
            document.getElementById('guncelFiyatYazi').innerText = `Güncel Fiyat: ${u.fiyat} TL`;
            peyAlani.style.display = 'block';
        } else {
            sahneBaslik.innerText = "Lot # - Sahnede aktif ürün yok";
            sahneMedya.innerHTML = `<span style="color:#64748b;">Yöneticinin ürünü sahneye alması bekleniyor...</span>`;
            sahneDetay.innerHTML = "";
            peyAlani.style.display = 'none';
        }

        // Arşiv Ürünleri Listeleme
        if(data.urunler) {
            let select = document.getElementById('arsivUrunSecim');
            let seciliDeger = select.value;
            select.innerHTML = '<option value="">Arşivden ürün seçiniz...</option>';
            data.urunler.forEach(u => {
                let opt = document.createElement('option');
                opt.value = u.id;
                opt.innerText = `Lot #${u.lot} - ${u.ad} (${u.fiyat} TL)`;
                select.appendChild(opt);
            });
            if(seciliDeger) select.value = seciliDeger;
        }
    });
}

function peyVer(miktar) {
    if(!aktifKullanici) { alert("Önce giriş yapmalısınız!"); return; }
    fetch('/pey-ver', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ musteri_adi: aktifKullanici, miktar: miktar, islem: 'arttir' })
    }).then(res => res.json()).then(d => {
        if(d.success) veriGetirIzleyici();
    });
}

function hemenAlSatinal() {
    if(!aktifKullanici) { alert("Önce giriş yapmalısınız!"); return; }
    if(!confirm("Bu ürünü hemen al fiyatıyla satın almak istediğinize emin misiniz?")) return;
    fetch('/pey-ver', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ musteri_adi: aktifKullanici, islem: 'hemen_al' })
    }).then(res => res.json()).then(d => {
        if(d.success) {
            alert("Tebrikler! Ürünü hemen al ile satın aldınız.");
            veriGetirIzleyici();
        }
    });
}

function onTeklifGonder() {
    if(!aktifKullanici) { alert("Önce giriş yapmalısınız!"); return; }
    let urunId = document.getElementById('arsivUrunSecim').value;
    let teklif = document.getElementById('onTeklifTutar').value;
    if(!urunId || !teklif) { alert("Lütfen bir ürün seçin ve teklif tutarı yazın!"); return; }

    fetch('/on-teklif-gonder', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ musteri_adi: aktifKullanici, urun_id: urunId, teklif: teklif })
    }).then(res => res.json()).then(d => {
        if(d.success) {
            alert("✅ Ön teklifiniz yöneticiye başarıyla iletildi!");
            document.getElementById('onTeklifTutar').value = "";
        }
    });
}

setInterval(veriGetirIzleyici, 2000);
</script>
</body>
</html>
