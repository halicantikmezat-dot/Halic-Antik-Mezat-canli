<script>
    // Saf WebSocket zorlaması (400 / 429 hatalarını engeller)
    const socket = io({
        transports: ['websocket'],
        upgrade: false
    });

    let kullaniciAdi = "", secilenArsivUrunId = null;
    let aktifSahneUrunId = null;
    let tumUrunlerArsivi = [];
    let muzikListesiGuncel = [];
    let sonGlobalOnTeklifler = []; 
    let sonYuklenenSahneMedyaUrl = null; 
    let audioCtx = null;
    let sonDurumData = null;

    function sesKilidiAc() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function videoTikTakSesiCal(kalan) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (kalan <= 10) {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(kalan % 2 === 0 ? 800 : 600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
            }
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch(e) {}
    }

    function gongSesiCal() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        } catch(e) {}
    }

    function formatLot(num) {
        return String(num || 1).padStart(4, '0');
    }

    window.onload = function() {
        let ad = localStorage.getItem('halic_antik_ad');
        if(ad && ad !== "null" && ad !== "undefined") {
            kullaniciAdi = ad;
            document.getElementById('aktifKullaniciGosterge').innerText = ad;
            document.getElementById('kayitEkrani').style.display = 'none';
            document.getElementById('mezatAlani').classList.remove('kilitli');
        }
    };

    socket.on('izleyici_sayisi_guncelle', function(data) {
        if(data && data.sayi) document.getElementById('onlineCount').innerText = data.sayi;
    });

    // Sunucudan gelen merkezi soket verisi
    socket.on('tam_durum_guncelle', function(data) {
        sonDurumData = data;
        if(data.on_teklifler) {
            sonGlobalOnTeklifler = data.on_teklifler;
            if(secilenArsivUrunId) urunSecimGuncellemeEkrani(secilenArsivUrunId);
        }

        if(data.muzik_listesi && JSON.stringify(data.muzik_listesi) !== JSON.stringify(muzikListesiGuncel)) {
            muzikListesiGuncel = data.muzik_listesi;
            let audioEl = document.getElementById('arkaplanMuzik');
            if(audioEl && muzikListesiGuncel.length > 0 && !audioEl.src) {
                audioEl.src = muzikListesiGuncel[muzikListesiGuncel.length - 1];
            }
        }

        if(data.urunler) {
            tumUrunlerArsivi = data.urunler;
            let select = document.getElementById('urunListesiSecim');
            let filtre = document.getElementById('kategoriFiltre').value;
            let mevcutSecimDegeri = select.value;

            select.innerHTML = '<option value="">İncelemek için ürün seçiniz...</option>';
            tumUrunlerArsivi.forEach(u => {
                if(u.durum === 'Satıldı') return;
                if(filtre && u.kategori !== filtre) return;
                let opt = document.createElement('option');
                opt.value = u.id;
                opt.innerText = `${formatLot(u.lot)} - ${u.ad} (Başlangıç: ${u.fiyat} TL)`;
                select.appendChild(opt);
            });
            if(mevcutSecimDegeri) select.value = mevcutSecimDegeri;
        }

        sahneyiGuncelle(data.aktif_urun, data.durum, data.pey, data.kazanan);

        if(data.musteriler && kullaniciAdi) {
            let m = data.musteriler.find(x => x.ad === kullaniciAdi);
            if(m) document.getElementById('bonusGosterge').innerText = m.puan !== undefined ? m.puan : (m.bonus || 100);
        }
    });

    socket.on('pey_guncellendi', function(data) {
        document.getElementById('currentBid').innerText = data.guncel_fiyat;
        document.getElementById('aktif_kazanan').innerText = data.kazanan_ad;
        gongSesiCal();
        
        const feed = document.getElementById('bidFeed');
        const item = document.createElement('div');
        item.className = 'feed-item';
        item.innerHTML = `<span><b>${data.kazanan_ad}</b></span> <span style="color:#34d399; font-weight:800;">${data.guncel_fiyat} TL</span>`;
        feed.prepend(item);
    });

    socket.on('sayac_guncelle', function(data) {
        let kalan = data.kalan;
        let digits = document.getElementById('timerDigits');
        let statusTitle = document.getElementById('timerStatusTitle');
        let subText = document.getElementById('timerSubText');
        let timerBox = document.getElementById('videoTimerBox');
        let dialContainer = document.getElementById('videoDialContainer');
        let progressBar = document.getElementById('dialProgressBar');

        digits.innerText = String(kalan).padStart(2, '0');
        statusTitle.innerText = kalan <= 10 ? "⚠️ SON TEKLİFLER!" : "GERİ SAYIM SÜRÜYOR";
        subText.innerText = `${kalan} Saniye Kaldı`;

        let progressPercent = Math.max(0, kalan / 60);
        let strokeOffset = 188.4 - (188.4 * progressPercent);
        progressBar.style.strokeDashoffset = strokeOffset;

        if (kalan <= 10) {
            timerBox.classList.add('urgent');
            dialContainer.classList.add('urgent');
        } else {
            timerBox.classList.remove('urgent');
            dialContainer.classList.remove('urgent');
        }

        videoTikTakSesiCal(kalan);
    });

    socket.on('sayac_bitti', function(data) {
        let digits = document.getElementById('timerDigits');
        let statusTitle = document.getElementById('timerStatusTitle');
        let subText = document.getElementById('timerSubText');
        let timerBox = document.getElementById('videoTimerBox');
        let dialContainer = document.getElementById('videoDialContainer');
        let progressBar = document.getElementById('dialProgressBar');

        digits.innerText = "00";
        statusTitle.innerText = "🔨 SATILDI!";
        subText.innerText = "Mezat Sonlandı";
        progressBar.style.strokeDashoffset = 188.4;
        timerBox.classList.remove('urgent');
        dialContainer.classList.remove('urgent');

        gongSesiCal();
    });

    function kayitOl() {
        let ad = document.getElementById('k_ad').value.trim();
        let tel = document.getElementById('k_tel').value.trim();
        let mail = document.getElementById('k_mail').value.trim();
        let adres = document.getElementById('k_adres').value.trim();
        
        if(!ad) { alert("Lütfen Ad Soyad alanını doldurun!"); return; }

        fetch('/kayit-ol', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ad, tel, mail, adres })
        }).then(res => res.json()).then(d => {
            alert(d.mesaj || "Kayıt talebiniz alındı.");
            kullaniciAdi = ad;
            localStorage.setItem('halic_antik_ad', ad);
            document.getElementById('aktifKullaniciGosterge').innerText = ad;
            document.getElementById('kayitEkrani').style.display = 'none';
            document.getElementById('mezatAlani').classList.remove('kilitli');
        });
    }

    function openRegisterModal() {
        if (!kullaniciAdi) {
            alert("Henüz kayıtlı bir hesabınız bulunmuyor.");
            return;
        }

        if (sonDurumData && sonDurumData.musteriler) {
            let m = sonDurumData.musteriler.find(x => x.ad === kullaniciAdi);
            if (m) {
                document.getElementById('p_ad').value = m.ad || "";
                document.getElementById('p_tel').value = m.tel !== "-" ? m.tel : "";
                document.getElementById('p_mail').value = m.mail !== "-" ? m.mail : "";
                document.getElementById('p_adres').value = m.adres !== "-" ? m.adres : "";
                
                let rozet = document.getElementById('p_durum_rozet');
                if (m.durum === 'onayli') {
                    rozet.innerText = "✅ Onaylı Üye";
                    rozet.style.background = "#059669";
                } else if (m.durum === 'engelli') {
                    rozet.innerText = "🚫 Hesabınız Engellendi";
                    rozet.style.background = "var(--btn-red)";
                } else {
                    rozet.innerText = "⏳ Yönetici Onayı Bekliyor";
                    rozet.style.background = "var(--accent-gold)";
                    rozet.style.color = "#000";
                }
            }
        }
        document.getElementById('profileModal').style.display = 'flex';
    }

    function profilGuncelle() {
        let yeniAd = document.getElementById('p_ad').value.trim();
        let tel = document.getElementById('p_tel').value.trim();
        let mail = document.getElementById('p_mail').value.trim();
        let adres = document.getElementById('p_adres').value.trim();

        if (!yeniAd) { alert("Ad Soyad alanı boş bırakılamaz!"); return; }

        fetch('/kayit-ol', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ad: yeniAd, tel, mail, adres })
        })
        .then(res => res.json())
        .then(d => {
            alert("✅ Profil bilgileriniz güncellendi!");
            kullaniciAdi = yeniAd;
            localStorage.setItem('halic_antik_ad', yeniAd);
            document.getElementById('aktifKullaniciGosterge').innerText = yeniAd;
            closeModal('profileModal');
        });
    }

    function hesabiTamamenSil() {
        if (!confirm("Hesabınızı silmek istediğinize emin misiniz?")) return;

        localStorage.removeItem('halic_antik_ad');
        kullaniciAdi = "";
        document.getElementById('aktifKullaniciGosterge').innerText = "Giriş Yapılmadı";
        document.getElementById('kayitEkrani').style.display = 'block';
        document.getElementById('mezatAlani').classList.add('kilitli');
        closeModal('profileModal');
        alert("🗑️ Hesabınız sıfırlandı.");
    }

    function sahneyiGuncelle(urunObj, durum, peyTutar, kazananKisi) {
        let medyaDiv = document.getElementById('medyaKapsayici');
        let soldBanner = document.getElementById('soldBanner');
        let btnYuzdeOn = document.getElementById('btnYuzdeOn');

        if (!urunObj) {
            aktifSahneUrunId = null;
            sonYuklenenSahneMedyaUrl = null;
            document.getElementById('aktif_baslik').innerText = "0000 - Sahnede aktif ürün yok";
            document.getElementById('currentBid').innerText = "0";
            document.getElementById('aktif_acilis_fiyat').innerText = "0 TL";
            document.getElementById('aktif_hemen_al_fiyat').innerText = "0 TL";
            document.getElementById('tanitimMetni').innerText = "Şu an sahnede ürün bulunmamaktadır.";
            document.getElementById('aktif_kazanan').innerText = "Yok";
            btnYuzdeOn.classList.add('btn-disabled');
            soldBanner.style.display = 'none';
            medyaDiv.innerHTML = '<p style="color: #94a3b8; font-size: 14px; font-weight:bold;">📺 Canlı Sahne Bekleniyor...</p><button class="audio-toggle" onclick="toggleAudio()">🔊 Sesi Aç / Kapat</button>';
            return;
        }

        aktifSahneUrunId = urunObj.id;
        document.getElementById('aktif_baslik').innerText = `${formatLot(urunObj.lot)} - ${urunObj.ad}`;
        document.getElementById('tanitimMetni').innerText = urunObj.tanitim_yazisi || "Hikaye girilmemiş.";
        document.getElementById('aktif_acilis_fiyat').innerText = (urunObj.fiyat || 0) + " TL";
        document.getElementById('aktif_hemen_al_fiyat').innerText = (urunObj.hemen_al_fiyat || 0) + " TL";

        if (durum === "Satıldı" || urunObj.durum === "Satıldı") {
            btnYuzdeOn.classList.add('btn-disabled');
            soldBanner.style.display = 'block';
            document.getElementById('soldWinnerName').innerText = kazananKisi || urunObj.kazanan || "Bilinmiyor";
            document.getElementById('soldPrice').innerText = (peyTutar || urunObj.guncel_fiyat || urunObj.fiyat) + " TL";
            document.getElementById('currentBid').innerText = peyTutar || urunObj.guncel_fiyat || urunObj.fiyat;
            document.getElementById('aktif_kazanan').innerText = kazananKisi || urunObj.kazanan || "Satıldı";
        } else {
            soldBanner.style.display = 'none';
            let guncelPey = peyTutar || urunObj.fiyat;
            document.getElementById('currentBid').innerText = guncelPey;
            document.getElementById('aktif_kazanan').innerText = kazananKisi || "Henüz Yok";
            btnYuzdeOn.classList.remove('btn-disabled');
        }

        let aktifVideo = urunObj.video;
        let aktifFoto = (urunObj.fotograflar && urunObj.fotograflar[0]);
        let hedefUrl = aktifVideo || aktifFoto;

        if (hedefUrl && hedefUrl !== sonYuklenenSahneMedyaUrl) {
            sonYuklenenSahneMedyaUrl = hedefUrl;
            medyaDiv.innerHTML = "";
            if(aktifVideo) {
                let v = document.createElement('video');
                v.id = "stageVideo";
                v.src = aktifVideo;
                v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
                medyaDiv.appendChild(v);
            } else if(aktifFoto) {
                let img = document.createElement('img');
                img.src = aktifFoto;
                medyaDiv.appendChild(img);
            }
            medyaDiv.innerHTML += '<button class="audio-toggle" onclick="toggleAudio()">🔊 Sesi Aç / Kapat</button>';
        }
    }

    function kategoriDegisti() {
        document.getElementById('urunListesiSecim').value = "";
        urunSecimDegisti();
    }

    function urunSecimDegisti() {
        let select = document.getElementById('urunListesiSecim');
        secilenArsivUrunId = select.value || null;
        let anaKutu = document.getElementById('secilenUrunOnizleme');
        let tekliflerKutusu = document.getElementById('urunOnTekliflerKutusu');

        if (!secilenArsivUrunId) {
            anaKutu.style.display = 'none';
            tekliflerKutusu.style.display = 'none';
            return;
        }

        let secilenUrun = tumUrunlerArsivi.find(u => String(u.id) === String(secilenArsivUrunId));
        if (secilenUrun) {
            anaKutu.style.display = 'block';
            document.getElementById('secilenUrunBaslik').innerText = `${formatLot(secilenUrun.lot)} - ${secilenUrun.ad}`;
            document.getElementById('secilenUrunKategori').innerText = secilenUrun.kategori || "Belirtilmemiş";
            document.getElementById('secilenUrunAcilis').innerText = `${secilenUrun.fiyat} TL`;
            document.getElementById('secilenUrunHemenAl').innerText = `${secilenUrun.hemen_al_fiyat || 0} TL`;
            document.getElementById('secilenUrunSecere').innerText = secilenUrun.tanitim_yazisi || "Hikaye girilmemiş.";

            urunSecimGuncellemeEkrani(secilenArsivUrunId);
        }
    }

    function urunSecimGuncellemeEkrani(uId) {
        let buUruneTeklifler = sonGlobalOnTeklifler.filter(t => String(t.urun_id) === String(uId));
        let tekliflerKutusu = document.getElementById('urunOnTekliflerKutusu');
        let tekliflerListeIci = document.getElementById('urunOnTekliflerListeIci');
        tekliflerKutusu.style.display = 'block';
        
        if(buUruneTeklifler.length > 0) {
            let html = '<ul style="margin:0; padding-left:15px;">';
            buUruneTeklifler.forEach(t => {
                html += `<li><b>${t.musteri_adi}</b>: <span style="color:#34d399; font-weight:800;">${t.teklif} TL</span></li>`;
            });
            html += '</ul>';
            tekliflerListeIci.innerHTML = html;
        } else {
            tekliflerListeIci.innerHTML = '<span style="color:#94a3b8;">Bu ürün için henüz teklif yok. İlk teklifi verin!</span>';
        }
    }

    function onTeklifGonder() {
        let select = document.getElementById('urunListesiSecim');
        let urunId = select.value;
        let teklifMiktari = parseFloat(document.getElementById('onTeklifMiktari').value);

        if(!urunId) { alert("Lütfen arşivden ürün seçin!"); return; }
        if(isNaN(teklifMiktari) || teklifMiktari <= 0) { alert("Lütfen geçerli bir teklif rakamı yazın!"); return; }

        fetch('/on-teklif-ver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ urun_id: urunId, musteri_adi: kullaniciAdi, teklif: teklifMiktari })
        }).then(res => res.json()).then(d => {
            if(d.success) {
                gongSesiCal();
                alert("✅ Ön teklifiniz iletildi!");
                document.getElementById('onTeklifMiktari').value = "";
                select.value = "";
                urunSecimDegisti();
            } else {
                alert(d.mesaj || "Teklif gönderilemedi.");
            }
        });
    }

    function yuzdeOnPeyVer() {
        if(!aktifSahneUrunId) {
            alert("⚠️ Şu an sahnede yönetici tarafından başlatılmış aktif bir mezat ürünü bulunmuyor!");
            return;
        }
        let current = parseFloat(document.getElementById('currentBid').innerText) || 0;
        let artis = current > 0 ? Math.round(current * 0.10) : 100;
        let hedefTutar = current + (artis > 0 ? artis : 100);
        peyGonder(hedefTutar);
    }

    function serbestPeyVer() {
        if(!aktifSahneUrunId) {
            alert("⚠️ Şu an sahnede yönetici tarafından başlatılmış aktif bir mezat ürünü bulunmuyor!");
            return;
        }
        let current = parseFloat(document.getElementById('currentBid').innerText) || 0;
        let miktar = prompt(`Mevcut Fiyat: ${current} TL\nVermek istediğiniz teklifi girin:`);
        if(!miktar) return;
        let tutar = parseFloat(miktar);
        if(isNaN(tutar) || tutar <= current) {
            alert(`⚠️ Teklif mevcut fiyatın (${current} TL) üzerinde olmalıdır!`);
            return;
        }
        peyGonder(tutar);
    }

    function peyGonder(miktar) {
        if(!kullaniciAdi) { alert("Lütfen önce kaydolun!"); return; }
        if(!aktifSahneUrunId) { alert("Sahnede aktif ürün yok!"); return; }
        
        fetch('/pey-ver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ urun_id: aktifSahneUrunId, musteri_adi: kullaniciAdi, miktar: miktar, islem: 'pey' })
        }).then(res => res.json()).then(d => {
            if(!d.success) {
                alert("⚠️ " + (d.mesaj || "Pey verilemedi!"));
            } else {
                gongSesiCal();
            }
        });
    }

    function hemenAl() {
        if(!aktifSahneUrunId) { alert("Sahnede aktif ürün yok!"); return; }
        if(!confirm("Bu ürünü hemen al fiyatıyla satın almak istiyor musunuz?")) return;
        
        fetch('/pey-ver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ urun_id: aktifSahneUrunId, musteri_adi: kullaniciAdi, islem: 'hemen_al' })
        }).then(res => res.json()).then(d => {
            if(d.success) {
                gongSesiCal();
                document.getElementById('congratsModal').style.display = 'flex';
            } else {
                alert(d.mesaj || "İşlem gerçekleştirilemedi.");
            }
        });
    }

    function openPosModal() { document.getElementById('posModal').style.display = 'flex'; }
    function openLegalModal() { document.getElementById('legalModal').style.display = 'flex'; }
    function processPayment() { alert("3D Secure onaylandı!"); closeModal('posModal'); }
    function toggleAudio() {
        const video = document.getElementById('stageVideo');
        if(video) {
            video.muted = !video.muted;
            alert(video.muted ? "🔇 Video sesi kapatıldı" : "🔊 Video sesi açıldı");
        } else {
            alert("Sahnede sesli video bulunmuyor.");
        }
    }

    function sesliDinle() {
        let metin = document.getElementById('tanitimMetni').innerText;
        if(!metin || metin === "-" || metin.includes("bulunmamaktadır")) return;
        if('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(metin);
            u.lang = 'tr-TR';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
