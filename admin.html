<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balat Mezat - Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #16213e; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header h1 { color: #e94560; text-align: center; font-size: 24px; margin-top: 0; }
        .section { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .section h2 { margin-top: 0; font-size: 18px; color: #4ecca3; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #1a1a2e; background: #1a1a2e; color: #fff; font-size: 16px; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
        button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-primary { background: #e94560; color: white; }
        .btn-quick { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-timer { background: #ffc107; color: black; }
        .btn-ai { background: #9c27b0; color: white; }
        .live-status { font-size: 20px; font-weight: bold; color: #ffd700; margin-bottom: 5px; }
        .pey-list { max-height: 120px; overflow-y: auto; background: #1a1a2e; padding: 10px; border-radius: 6px; }
        .pey-item { padding: 5px 0; border-bottom: 1px solid #2a2a4e; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Balat Mezat - Yönetim Paneli</h1>
    </div>

    <div class="section">
        <h2>Canlı Mezat Durumu</h2>
        <div class="live-status">LOT: <span id="current-lot">1</span> | <span id="current-title">Ürün Yok</span></div>
        <div class="live-status" style="color: #4ecca3;">Mevcut Fiyat: <span id="current-price">0</span> TL</div>
    </div>

    <div class="section">
        <h2>Yeni Ürün Yayına Al & Yapay Zeka Tanıtımı</h2>
        <div class="input-group">
            <input type="text" id="lot-no" placeholder="Lot No (Örn: 102)">
            <input type="text" id="urun-adi" placeholder="Ürün Adı / Açıklaması">
            <input type="number" id="baslangic-fiyati" placeholder="Başlangıç Fiyatı (TL)">
            <input type="text" id="gorsel-url" placeholder="Görsel Linki (Opsiyonel)">
            <button class="btn-primary" onclick="urunYukle()">Ürünü Canlıya Çıkar</button>
            <button class="btn-ai" onclick="yapayZekaOku()">🗣️ Yapay Zeka ile Ürünü Sesli Tanıt</button>
        </div>
    </div>

    <div class="section">
        <h2>Hızlı Pey Yönetimi</h2>
        <div class="input-group">
            <input type="text" id="musteri-adi" placeholder="Müşteri Adı / Rumuz">
        </div>
        <div class="btn-grid">
            <button class="btn-quick" onclick="hizliPeyVer(50)">+50 TL</button>
            <button class="btn-quick" onclick="hizliPeyVer(100)">+100 TL</button>
            <button class="btn-quick" onclick="hizliPeyVer(250)">+250 TL</button>
            <button class="btn-quick" onclick="hizliPeyVer(500)">+500 TL</button>
        </div>
        <div style="margin-top: 15px;">
            <button class="btn-danger" style="width: 100%; padding: 12px;" onclick="sonPeyiSil()">⚠️ Yanlış Pey İptal (Son Peyi Geri Al)</button>
        </div>
    </div>

    <div class="section">
        <h2>Sayaç & Müzik Yönetimi</h2>
        <div class="btn-grid">
            <button class="btn-timer" onclick="sayacBaslat(5)">5 Sn</button>
            <button class="btn-timer" onclick="sayacBaslat(10)">10 Sn</button>
            <button class="btn-timer" onclick="sayacBaslat(20)">20 Sn</button>
            <button class="btn-timer" onclick="sayacBaslat(60)">60 Sn</button>
        </div>
    </div>

    <div class="section">
        <h2>Son Verilen Peyler</h2>
        <div class="pey-list" id="pey-gecmisi">
            <div style="color: #888;">Henüz pey verilmedi.</div>
        </div>
    </div>
</div>

<script>
    async function durumuGuncelle() {
        try {
            const res = await fetch('/api/durum');
            const data = await res.json();
            document.getElementById('current-lot').innerText = data.lot || '1';
            document.getElementById('current-title').innerText = data.urun_adi || 'Ürün Yok';
            document.getElementById('current-price').innerText = data.fiyat || '0';

            const peyList = document.getElementById('pey-gecmisi');
            if (data.peyler && data.peyler.length > 0) {
                peyList.innerHTML = data.peyler.slice().reverse().map(p =>
                    `<div class="pey-item"><span><strong>${p.isim || 'Atsız'}</strong></span><span style="color:#4ecca3;">${p.miktar} TL</span></div>`
                ).join('');
            } else {
                peyList.innerHTML = '<div style="color: #888;">Henüz pey verilmedi.</div>';
            }
        } catch (e) {}
    }

    async function urunYukle() {
        const lot = document.getElementById('lot-no').value;
        const urun_adi = document.getElementById('urun-adi').value;
        const fiyat = document.getElementById('baslangic-fiyati').value;
        const gorsel = document.getElementById('gorsel-url').value;

        await fetch('/api/urun-yukle', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ lot, urun_adi, fiyat, gorsel })
        });
        durumuGuncelle();
    }

    function yapayZekaOku() {
        const lot = document.getElementById('lot-no').value || document.getElementById('current-lot').innerText;
        const urun = document.getElementById('urun-adi').value || document.getElementById('current-title').innerText;
        const fiyat = document.getElementById('baslangic-fiyati').value || document.getElementById('current-price').innerText;

        const metin = `Sıradaki eserimiz, lot numarası ${lot}. ${urun}. Başlangıç fiyatı ${fiyat} Türk Lirası. Alıcısına şimdiden hayırlı olsun!`;

        const synth = window.speechSynthesis;
        const utterThis = new SpeechSynthesisUtterance(metin);
        utterThis.lang = 'tr-TR';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
    }

    async function hizliPeyVer(artis) {
        const isim = document.getElementById('musteri-adi').value || "Sistem";
        await fetch('/api/pey-ver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ isim, artis })
        });
        durumuGuncelle();
    }

    async function sonPeyiSil() {
        if (confirm("Son pey silinsin mi?")) {
            await fetch('/api/son-peyi-sil', { method: 'POST' });
            durumuGuncelle();
        }
    }

    async function sayacBaslat(saniye) {
        await fetch('/api/sayac-baslat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ saniye })
        });
    }

    setInterval(durumuGuncelle, 2000);
    durumuGuncelle();
</script>
</body>
</html>
