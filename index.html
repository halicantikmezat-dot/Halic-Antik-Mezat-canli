<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balat Mezat - Canlı Yayın</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0d1117; color: #fff; text-align: center; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { max-width: 600px; width: 100%; background: #161b22; padding: 30px; border-radius: 15px; border: 2px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lot { font-size: 26px; color: #58a6ff; font-weight: bold; }
        .title { font-size: 34px; margin: 20px 0; color: #f0f6fc; }
        .price { font-size: 55px; color: #3fb950; font-weight: bold; margin: 20px 0; }
        .timer-box { font-size: 65px; color: #ff7b72; font-weight: bold; margin: 20px 0; display: none; }
        .gong-box { font-size: 40px; color: #d29922; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="lot">LOT: <span id="lot-no">1</span></div>
    <div class="title" id="urun-adi">Yükleniyor...</div>
    <div class="price"><span id="fiyat">0</span> TL</div>

    <div id="timer-display" class="timer-box">10</div>
    <div id="gong-display" class="gong-box">🔔 SATILDI!</div>
</div>

<audio id="dambir-audio" loop src="https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3"></audio>
<audio id="gong-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    let sonSayac = 0;
    let sayacInterval = null;

    async function canliVeriCek() {
        try {
            const res = await fetch('/api/durum');
            const data = await res.json();

            document.getElementById('lot-no').innerText = data.lot || '1';
            document.getElementById('urun-adi').innerText = data.urun_adi || 'Ürün Yok';
            document.getElementById('fiyat').innerText = data.fiyat || '0';

            if (data.sayac && data.sayac > 0 && data.sayac !== sonSayac) {
                sonSayac = data.sayac;
                sayaciCalistir(data.sayac);
            }
        } catch (e) {}
    }

    function sayaciCalistir(saniye) {
        const timerBox = document.getElementById('timer-display');
        const gongBox = document.getElementById('gong-display');
        const dambirAudio = document.getElementById('dambir-audio');
        const gongAudio = document.getElementById('gong-audio');

        gongBox.style.display = 'none';
        timerBox.style.display = 'block';
        timerBox.innerText = saniye;

        dambirAudio.play().catch(() => {});

        clearInterval(sayacInterval);
        let kalan = saniye;

        sayacInterval = setInterval(() => {
            kalan--;
            timerBox.innerText = kalan;

            if (kalan <= 0) {
                clearInterval(sayacInterval);
                timerBox.style.display = 'none';
                gongBox.style.display = 'block';

                dambirAudio.pause();
                dambirAudio.currentTime = 0;
                gongAudio.play().catch(() => {});
            }
        }, 1000);
    }

    setInterval(canliVeriCek, 1500);
</script>
</body>
</html>
